services:
  sky-rpc-core:
    build: .
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:8080"
      - "127.0.0.1:9090:9090"
    environment:
      HTTP_ADDR: ":8080"
      GRPC_ADDR: ":9090"
      MAX_CONCURRENT_RPCS: "256"
    read_only: true
    tmpfs:
      - /tmp:size=16m,noexec,nosuid
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "/sky-rpc-core", "--healthcheck"]
      interval: 30s
      timeout: 3s
      retries: 3
